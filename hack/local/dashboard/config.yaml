components:
  - name: "Prow"
    description: "The backbone of the CI system"
    ship_team: "DPTP"
    slack_reporting:
      - channel: "#ops-testplatform"
        severity: "Down"
    sub_components:
      - name: "Tide"
        description: "Automated merging of PRs"
        long_description: "Tide is a tool that automates the merging of PRs based on the properly added labels and job statuses."
        documentation_url: "https://docs.prow.k8s.io/docs/components/core/tide/"
        tags: ["pr-merging", "github"]
        requires_confirmation: true
        critical: true
        report_threshold: 3
      - name: "Deck"
        description: "Dashboard for Prow"
        tags: ["frontend"]
        requires_confirmation: false
        report_threshold: 2
    owners:
      - user: "developer"
      - service_account: "system:serviceaccount:ship-status:component-monitor"
  - name: "Build Farm"
    description: "Where the CI jobs are run"
    ship_team: "DPTP"
    slack_reporting:
      - channel: "#ops-testplatform"
        severity: "Down"
    sub_components:
      - name: "Build01"
        description: "AWS build farm cluster"
        long_description: "This is the original AWS build farm cluster where many of the CI jobs are run, especially those that utilize AWS."
        tags: ["jobs", "aws"]
        requires_confirmation: true
      - name: "Build02"
        description: "GCP build farm cluster"
        tags: ["jobs", "gcp"]
        requires_confirmation: true
      - name: "Build03"
        description: "AWS build farm cluster"
        tags: ["jobs", "aws"]
        requires_confirmation: true
      - name: "Build04"
        description: "GCP build farm cluster"
        tags: ["jobs", "gcp"]
        requires_confirmation: true
    owners:
      - user: "developer"
      - service_account: "system:serviceaccount:ship-status:component-monitor"
  - name: "Sippy"
    description: "CI Private Investigator"
    ship_team: "TRT"
    slack_reporting:
      - channel: "#trt-alert"
        severity: "Down"
    sub_components:
      - name: "Sippy"
        description: "The non-auth variant of Sippy"
        requires_confirmation: false
        critical: true
      - name: "Sippy-Auth"
        description: "The auth variant of Sippy"
        requires_confirmation: false
    owners:
      - user: "someone-else"
      - service_account: "system:serviceaccount:ship-status:component-monitor"
  - name: "Mocked"
    description: "Mocked component for component-monitor local development"
    ship_team: "TRT"
    slack_reporting:
      - channel: "#trt-alert"
        severity: "Down"
    sub_components:
      - name: "Frontend"
        description: "Mocked frontend monitored via http component monitor"
        requires_confirmation: false
        monitoring:
          frequency: 20s
          component_monitor: "local-component-monitor"
          auto_resolve: true
      - name: "API Success Rate"
        description: "Mocked API success rate monitored via prometheus (scalar) component monitor"
        requires_confirmation: false
        monitoring:
          frequency: 20s
          component_monitor: "local-component-monitor"
          auto_resolve: true
      - name: "Data Load"
        description: "Mocked data load monitored via prometheus (vector) component monitor"
        requires_confirmation: false
        monitoring:
          frequency: 20s
          component_monitor: "local-component-monitor"
          auto_resolve: true
    owners:
      - user: "developer"
      - service_account: "system:serviceaccount:ship-status:component-monitor"
  - name: "TRT Incidents"
    description: "TRT Jira incidents labeled trt-incident"
    ship_team: "TRT"
    slo_component: true
    sub_components:
      - name: "Incidents"
        description: "Currently open TRT incidents"
        critical: true
        requires_confirmation: false
        exclude_from_main_outage_well: true
        monitoring:
          frequency: 5m
          component_monitor: "local-component-monitor"
          auto_resolve: true
          outage_per_reason: true
    owners:
      - user: "developer"
      - service_account: "system:serviceaccount:ship-status:component-monitor"
tags:
  - name: "PR Merging"
    description: "Components related to PR merging"
    color: "#4CAF50"
  - name: "GitHub"
    description: "Components that interact with GitHub"
    color: "#2196F3"
  - name: "Frontend"
    description: "Frontend user-facing components"
    color: "#FF9800"
  - name: "Jobs"
    description: "CI job execution components"
    color: "#9C27B0"
  - name: "AWS"
    description: "Components running on AWS infrastructure"
    color: "#FF5722"
  - name: "GCP"
    description: "Components running on GCP infrastructure"
    color: "#03A9F4"

trusted_delegators:
  - "system:serviceaccount:ship-status:mcp-server"

team_slos:
  - team: TRT
    owners:
      - user: "chai-bot"
      - user: "developer"
    slo_components:
      - trt-incidents
    slos:
      - name: accepted-payload-per-day
        display_name: "1 accepted payload per day"
        source: payload_acceptance
        workspace:
          kind: payload_streams
          schema_version: 1
          window: 24h
          min_accepted: 1
          recent_payloads: 2
          streams:
            - release_controller: amd64
              name: "5.1.0-0.nightly"
            - release_controller: amd64
              name: "5.1.0-0.ci"
            - release_controller: amd64
              name: "5.0.0-0.nightly"
            - release_controller: amd64
              name: "5.0.0-0.ci"
